name: CI

# Corre en cada push y en cada Pull Request.
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Instala EXACTAMENTE lo del package-lock (reproducible).
      - name: Instalar dependencias
        run: npm ci

      # Genera el cliente de Prisma (lo necesita el typecheck del back). Se corre
      # dentro del workspace back (donde vive el binario prisma). No toca la DB.
      - name: Generar cliente Prisma
        run: npm run build -w @stock-tracker/back

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test
