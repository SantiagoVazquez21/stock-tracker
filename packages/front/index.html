<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ticker — tu tracker de mercado</title>
    <meta
      name="description"
      content="Seguí acciones e índices (US y Merval) desde el día que los empezás a trackear: precio, variación y evolución en un solo lugar."
    />
    <meta name="theme-color" content="#191b21" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Tema antes del primer paint (evita el "flash" de color): usa la preferencia
         guardada o, si no hay, la del sistema operativo. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
          }
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>

    <!-- Open Graph (cómo se ve el link al compartirlo en WhatsApp, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Ticker — tu tracker de mercado" />
    <meta
      property="og:description"
      content="Seguí acciones e índices desde el día que los empezás a trackear."
    />
    <meta
      property="og:url"
      content="https://stock-tracker-gules-seven.vercel.app"
    />
    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Ticker — tu tracker de mercado" />
    <meta
      name="twitter:description"
      content="Seguí acciones e índices desde el día que los empezás a trackear."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
